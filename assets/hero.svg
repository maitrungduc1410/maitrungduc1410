<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Duc Trung Mai (James)</title>
  <desc id="heroDesc">Self-taught fullstack web developer and open-source maintainer, Vietnamese, based in Singapore.</desc>

  <defs>
    <radialGradient id="blobA" cx="50%" cy="50%" r="50%">
      <stop class="s1" offset="0%" stop-color="#0969da" stop-opacity="0.30"/>
      <stop class="s1" offset="100%" stop-color="#0969da" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="50%" cy="50%" r="50%">
      <stop class="s2" offset="0%" stop-color="#8250df" stop-opacity="0.24"/>
      <stop class="s2" offset="100%" stop-color="#8250df" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" gradientUnits="userSpaceOnUse" x1="64" y1="0" x2="240" y2="0">
      <stop class="s1" offset="0%" stop-color="#0969da"/>
      <stop class="s2" offset="100%" stop-color="#8250df"/>
    </linearGradient>
    <clipPath id="typeClip">
      <rect class="type" x="64" y="88" width="100" height="30"/>
    </clipPath>
  </defs>

  <style><![CDATA[
    :root {
      --fg: #1f2328;
      --muted: #59636e;
      --accent: #0969da;
      --accent2: #8250df;
      --line: #d1d9e0;
    }
    .s1 { stop-color: #0969da; }
    .s2 { stop-color: #8250df; }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #e6edf3;
        --muted: #8b949e;
        --accent: #58a6ff;
        --accent2: #bc8cff;
        --line: #30363d;
      }
      .s1 { stop-color: #58a6ff; }
      .s2 { stop-color: #bc8cff; }
    }

    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }

    .frame  { fill: none; stroke: var(--line, #d1d9e0); stroke-width: 1.5; }
    .sep    { stroke: var(--line, #d1d9e0); stroke-width: 1.5; }
    .prompt { fill: var(--accent, #0969da); font-size: 20px; }
    .caret  { fill: var(--accent, #0969da); }
    .name   { fill: var(--fg, #1f2328); font-size: 46px; font-weight: 700; letter-spacing: -0.5px; }
    .tag    { fill: var(--fg, #1f2328); font-size: 20px; }
    .meta   { fill: var(--muted, #59636e); font-size: 15px; letter-spacing: 0.3px; }
    .ul     { stroke: url(#rule); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 176; }

    @keyframes type   { from { width: 0 }  to { width: 100px } }
    @keyframes caret  { from { x: 64px }   to { x: 164px } }
    @keyframes blink  { 0%, 50% { opacity: 1 } 51%, 100% { opacity: 0 } }
    @keyframes rise   { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: translateY(0) } }
    @keyframes draw   { from { stroke-dashoffset: 176 } to { stroke-dashoffset: 0 } }
    @keyframes drift  { 0%, 100% { transform: translate(0, 0) } 50% { transform: translate(-14px, -10px) } }
    @keyframes drift2 { 0%, 100% { transform: translate(0, 0) } 50% { transform: translate(12px, 9px) } }

    .type   { animation: type 1.1s steps(8, end) 0.35s both; }
    .caret  { animation: caret 1.1s steps(8, end) 0.35s both, blink 1.06s steps(1) infinite; }
    .r1     { animation: rise 0.6s ease-out 1.35s both; }
    .r2     { animation: rise 0.6s ease-out 1.55s both; }
    .r3     { animation: rise 0.6s ease-out 1.75s both; }
    .ul     { animation: draw 0.9s ease-out 1.6s both; }
    .bA     { animation: drift 14s ease-in-out infinite; }
    .bB     { animation: drift2 18s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .type, .caret, .r1, .r2, .r3, .ul, .bA, .bB { animation: none; }
      .caret { opacity: 0.9; }
      .ul { stroke-dashoffset: 0; }
    }
  ]]></style>

  <g aria-hidden="true">
    <circle class="bA" cx="892" cy="78" r="112" fill="url(#blobA)"/>
    <circle class="bB" cx="956" cy="244" r="92" fill="url(#blobB)"/>
  </g>

  <rect class="frame" x="1" y="1" width="998" height="298" rx="16"/>
  <line class="sep" x1="1" y1="54" x2="999" y2="54"/>

  <g aria-hidden="true">
    <circle cx="32" cy="27" r="6" fill="#ff5f57" opacity="0.9"/>
    <circle cx="54" cy="27" r="6" fill="#febc2e" opacity="0.9"/>
    <circle cx="76" cy="27" r="6" fill="#28c840" opacity="0.9"/>
  </g>

  <g clip-path="url(#typeClip)">
    <text class="mono prompt" x="64" y="110" textLength="100" lengthAdjust="spacingAndGlyphs">$ whoami</text>
  </g>
  <rect class="caret" x="164" y="92" width="10" height="22" rx="1"/>

  <text class="sans name r1" x="64" y="180">Duc Trung Mai</text>
  <line class="ul" x1="64" y1="198" x2="240" y2="198"/>
  <text class="sans tag r2" x="64" y="234">Self-taught fullstack web developer &#183; Open-source maintainer</text>
  <text class="mono meta r3" x="64" y="264">Vietnamese &#183; Based in Singapore &#183; Building at TikTok</text>
</svg>
