# Regenerates the dynamic parts of the profile README and commits the result.
#
# Design rule for this repo: nothing shown on the profile may depend on a
# third-party server at page-view time. Every dynamic element is rendered here,
# in CI, and committed, so the README references relative paths that GitHub
# serves itself. The worst outcome of any failure below is a stale card - never
# a broken image.
#
# Third-party actions are pinned to a full commit SHA, not a tag. Tags are
# mutable and have been retroactively repointed at malicious commits in the
# past; a SHA cannot be. Dependabot keeps the pins current (.github/dependabot.yml).

name: Refresh profile

on:
  schedule:
    # 03:17 UTC daily. Deliberately off the hour: GitHub documents that the
    # schedule event is delayed under load, that "some queued jobs may be
    # dropped", and that load peaks at the start of every hour.
    - cron: "17 3 * * *"

  # Manual trigger. Also the way to re-run this after the 60-day auto-disable.
  workflow_dispatch:

  # Regenerate straight away when the template changes, so editing the source
  # of truth has a visible effect without waiting for the nightly run.
  # Safe from recursion: pushes made with GITHUB_TOKEN do not start new runs.
  push:
    branches: [master]
    paths:
      - README.tmpl.md
      - .github/workflows/profile.yml

# Least privilege. Every permission not listed here is set to `none`.
permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: false

env:
  # Optional. Set a repository variable named BLOG_FEED_URL to an RSS/Atom feed
  # to turn on the blog section. While it is unset - or if the feed is
  # unreachable or empty - the static fallback that lives between the markers
  # in README.tmpl.md is left exactly as written. Nothing breaks either way.
  BLOG_FEED_URL: ${{ vars.BLOG_FEED_URL }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # -------------------------------------------------------------------
      # 1. Stats card -> assets/stats.svg
      # -------------------------------------------------------------------
      # Generated here rather than hotlinked from a shared public instance.
      # The shared instance previously used by this profile returns
      # 503 DEPLOYMENT_PAUSED, and upstream now recommends this action.
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: stats
          # theme=transparent rather than the previous orange/pink gradient:
          # white on that gradient measured about 2.0:1, well under the 4.5:1
          # WCAG AA minimum. Transparent also inherits the reader's GitHub
          # theme, so one card is legible in both light and dark mode.
          options: username=${{ github.repository_owner }}&show_icons=true&hide=contribs,prs&theme=transparent
          path: assets/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          # Defaults to "false", which quietly writes a "Something went wrong"
          # card into the repo whenever the API rate-limits. Fail loudly
          # instead, so the previous good SVG stays committed and on display.
          fail_on_error: true

      # -------------------------------------------------------------------
      # 2. README.tmpl.md -> README.md   (MUST run before step 4)
      # -------------------------------------------------------------------
      # Ordering: the template render runs FIRST and the feed injection runs
      # AFTER it. This step rewrites README.md wholesale, so doing it second
      # would overwrite the freshly injected feed every time.
      #
      # Rendering first also makes the pipeline stateless: the result is a pure
      # function of (template + feed) and never depends on the previous
      # README.md. A bad run therefore cannot accumulate damage, and simply
      # re-running always converges on the correct output.
      #
      # No timestamp is written into the banner, on purpose. Any byte that
      # varies per run would defeat the commit-only-if-changed check in step 5
      # and produce a pointless commit every single day.
      - name: Render README.md from template
        run: |
          set -euo pipefail
          test -f README.tmpl.md
          {
            echo '<!-- AUTOGENERATED FILE - DO NOT EDIT. -->'
            echo '<!-- Edit README.tmpl.md; .github/workflows/profile.yml regenerates this file. -->'
            echo
            cat README.tmpl.md
          } > README.md

      # -------------------------------------------------------------------
      # 3. Decide whether there is a usable blog feed
      # -------------------------------------------------------------------
      # Checked before injecting rather than after failing. An unset variable,
      # an unreachable feed, or a feed with no entries all resolve to "skip",
      # which leaves the template's static fallback in place and keeps this
      # workflow green. A red workflow nobody looks at is not a safety net.
      - name: Probe blog feed
        id: feed
        run: |
          set -euo pipefail

          if [ -z "${BLOG_FEED_URL}" ]; then
            echo "BLOG_FEED_URL is not set - keeping the static fallback from the template."
            echo "usable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! curl -sfL --max-time 20 "${BLOG_FEED_URL}" -o /tmp/feed.xml; then
            echo "::warning::Blog feed is unreachable - keeping the static fallback from the template."
            echo "usable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          items=$(grep -c -E '<(item|entry)[ >]' /tmp/feed.xml || true)
          if [ "${items:-0}" -lt 1 ]; then
            echo "::warning::Blog feed parsed but contains no entries - keeping the static fallback."
            echo "usable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Feed reachable with ${items} entries."
          echo "usable=true" >> "$GITHUB_OUTPUT"

      # -------------------------------------------------------------------
      # 4. Blog feed -> between the markers in README.md
      # -------------------------------------------------------------------
      # Replaces the content between <!--START_SECTION:blog--> and
      # <!--END_SECTION:blog--> in place, leaving the rest of the file alone.
      - name: Inject latest blog posts
        if: steps.feed.outputs.usable == 'true'
        uses: gautamkrishnar/blog-post-workflow@f177491c77670f150ab4e9b9890254d8eba4164b # v1.9.7
        with:
          feed_list: ${{ env.BLOG_FEED_URL }}
          readme_path: "./README.md"
          max_post_count: "5"
          # This action commits and pushes by itself by default. Turn that off
          # so everything this workflow changes lands as one commit in step 5.
          skip_commit: "true"
          # It also ships its own dummy-commit keepalive, which commits even
          # when nothing changed. Disabled here; step 5 owns the keepalive
          # policy so there is exactly one place that decides when to commit.
          enable_keepalive: "false"
          retry_count: "3"
          retry_wait_time: "5"

      # -------------------------------------------------------------------
      # 5. Commit, but only when something actually changed
      # -------------------------------------------------------------------
      - name: Commit generated content
        # The standard bot identity, set through the environment rather than
        # `git config`. Git's env vars take precedence over every config file,
        # so this cannot be overridden by an ambient identity on the runner.
        #
        # Using the bot identity also deliberately keeps these commits off the
        # contribution graph: credit requires the author email to belong to a
        # GitHub account, and this one does not. Automation should not
        # manufacture green squares.
        env:
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        run: |
          set -euo pipefail

          git add -A -- README.md assets

          if ! git diff --staged --quiet; then
            git commit -m "chore: refresh generated profile content"
          else
            # Nothing changed. Guard against the documented rule that in a
            # public repository scheduled workflows are auto-disabled after
            # 60 days with no repository activity - which would silently
            # freeze this profile with no notification.
            #
            # A heartbeat is committed only once the branch has been quiet for
            # 30 days, comfortably inside the window. That costs roughly a
            # dozen commits a year instead of 365.
            last_commit_epoch=$(git log -1 --format=%ct)
            quiet_days=$(( ( $(date -u +%s) - last_commit_epoch ) / 86400 ))

            if [ "$quiet_days" -lt 30 ]; then
              echo "Nothing changed; last commit was ${quiet_days}d ago. Done."
              exit 0
            fi

            echo "Nothing changed, but the branch has been quiet ${quiet_days}d - writing a heartbeat."
            date -u +%Y-%m-%dT%H:%M:%SZ > .github/heartbeat
            git add -- .github/heartbeat
            git commit -m "chore: keepalive heartbeat to prevent 60-day workflow auto-disable"
          fi

          # Rebase in case anything else pushed while this job was running.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          # Explicit refspec rather than a bare `git push`, which needs an
          # upstream to be configured and fails with "no upstream branch"
          # when it is not.
          git push origin "HEAD:${GITHUB_REF_NAME}"